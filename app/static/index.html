<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>(HL)全球发布 / Global Publisher</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font:15px system-ui,Arial;
background:#f3f6fb;
color:#18243b
}

header{
background:#111d32;
color:white;
padding:20px 5%;
display:flex;
justify-content:space-between;
align-items:center
}

main{
max-width:1050px;
margin:30px auto;
padding:0 18px
}

.panel{
background:white;
border:1px solid #dfe5ef;
border-radius:15px;
padding:22px;
margin-bottom:18px
}

h1{font-size:24px}
h2{font-size:19px}

label{
display:block;
margin:12px 0 5px
}

input,textarea,select{
width:100%;
padding:11px;
border:1px solid #cbd5e1;
border-radius:8px;
font:inherit
}

button{
background:#285be8;
color:white;
border:0;
padding:11px 17px;
border-radius:8px;
cursor:pointer;
margin:7px 5px 7px 0
}

button:hover{
opacity:.85
}

.muted{
color:#64748b
}

.status{
color:#b45309
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(175px,1fr));
gap:10px
}

.chip{
border:1px solid #dce2ee;
padding:10px;
border-radius:9px
}

</style>

</head>


<body>


<header>

<strong>
▶ (HL)全球发布
<small>/ Global Publisher</small>
</strong>

<button id="lang">
English
</button>

</header>



<main>


<section class="panel">

<h1>
受保护的单管理员在线测试版
</h1>


<p class="muted">

真实上传和任务存储已接入。
五个平台尚未授权，不会真实发布。
仅供私有测试。

</p>


<label>
管理员令牌
</label>


<input 
type="password"
id="token"
placeholder="APP_ADMIN_TOKEN"
>


<button id="load">
连接后端 / 刷新
</button>


<div id="message"></div>


</section>




<section class="panel">

<h2>
社交平台 / Accounts
</h2>


<div id="accounts" class="grid">

</div>


</section>




<section class="panel">


<h2>
1. 上传真实视频
</h2>


<input 
type="file"
id="file"
accept="video/mp4,video/quicktime,video/webm"
>


<button id="upload">
上传视频
</button>


<div id="media"></div>


</section>




<section class="panel">


<h2>
2. 创建发布任务
</h2>


<select id="mediaSelect">

</select>


<label>
标题
</label>

<input id="title">


<label>
文案
</label>


<textarea id="caption"></textarea>



<label>
选择平台
</label>


<div id="platforms" class="grid">

</div>



<input 
type="datetime-local"
id="when"
>



<button id="create">
创建任务
</button>


</section>




<section class="panel">


<h2>
3. 发布任务状态
</h2>


<button id="refresh">
刷新任务
</button>


<div id="jobs">

</div>


</section>



</main>



<script src="/static/app.js" defer></script>


</body>

</html>
